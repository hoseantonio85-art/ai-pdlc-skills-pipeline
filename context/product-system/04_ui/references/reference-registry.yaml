  target: Accepted target composition; not a claim of production rollout.
ignored_sources:
  Assistant Knowledge-secondary-1:
    reason: duplicate of Assistant Knowledge-secondary
  General:
    reason: insufficient UI evidence
backlog:
- repeatable-form-group
- contextual-ai-block
- workflow-side-rail
- attachment-pattern-refinement
- deeper-surface-stack-navigation
rules:
- Select references by aspect, never by whole-screen similarity alone.
- Use no more than 2 references for a focused stage-03 decision unless conflict resolution requires more.
- Raw HTML/Pixso implementation is evidence only and is not frontend truth.
foundation_geometry_note: Visual aspect authority only if original approved reference is actually accessible; no legacy
  DOM or tokens treated as production truth.
