rules:
- Select owner UI references by aspect; never copy a whole screen automatically.
- Read UX/visual rules and pattern/organism registries before selecting UI references.
- Read component-index first.
- Read only selected component documentation and exact type declarations.
- Do not unpack or scan entire packages into the model context.
- Load registries before any runtime pattern or organism.
- Do not bulk-load HTML references or audit evidence.
- Absence of a product-specific pattern may allow a documented UX hypothesis, but do not silently copy NORM-only
  composition into another product profile.
