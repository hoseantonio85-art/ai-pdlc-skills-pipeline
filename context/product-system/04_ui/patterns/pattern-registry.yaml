loading_rule: Load only a pattern selected for the current surface.
runtime_overlay:
  loading_policy:
    default: index-first
    max_runtime_patterns_per_task: 4
    max_organisms_per_task: 3
    max_visual_references_per_task: 2
    full_audit_on_demand_only: true
  shared_shell_specs:
    modal:
      path: specs/modal.md
      status: canonical-draft
    drawer:
      path: specs/drawer.md
      status: canonical-draft
  runtime_patterns:
    registry-page:
      path: runtime/registry-page.md
      authoring_patterns:
      - entity-list-page
      - filter-bar-and-advanced-filter-drawer
      organisms:
      - registry-page-controls
      historical_composition_reference: ../references/html/norm-vertical-slice/index.html#registry
      norm_reference: ../references/html/starter/index.html
    situational-overview:
      path: runtime/situational-overview.md
      authoring_patterns:
      - situational-overview
      - entity-list-page
      selection_rule: explicit_check_on_registry_and_monitoring_pages
      historical_composition_reference: ../references/html/situational-overview/index.html
    entity-card-runtime:
      path: runtime/entity-card.md
      authoring_patterns:
      - entity-card
      historical_composition_reference: ../references/html/norm-vertical-slice/index.html#entity-card
      norm_reference: ../references/html/starter/index.html
    object-modal-view:
      path: runtime/object-modal-view.md
      authoring_patterns:
      - large-entity-modal
      shared_shell_spec: specs/modal.md
      organisms:
      - object-action-meta-zone
      canonical_overrides:
      - object_view_footer: none
      - object_actions_placement: action-meta-zone
      historical_composition_reference: ../references/html/norm-vertical-slice/index.html#object-modal
      norm_reference: ../references/html/starter/index.html
    drawer-runtime:
      path: runtime/drawer.md
      authoring_patterns:
      - drawer-inside-modal
      - filter-bar-and-advanced-filter-drawer
      shared_shell_spec: specs/drawer.md
      historical_composition_reference: ../references/html/norm-vertical-slice/index.html#drawer
      norm_reference: ../references/html/starter/index.html
  product_profiles:
    norm:
      object_modal_width: 1320
      object_modal_presentation: overlay-workspace
      object_view_action_meta_zone: true
      floating_create_chat_surface: supported-reference
    orm:
