limitations:
- NORM is the default context only when declared in user product-contexts registry or chosen project selector.
- Product model does not itself prove the current production release.
- External product specifications and repositories are attached through user-authorized product-evidence.yaml and opened
  selectively.
- UI Kit is external and its actual APIs must be inspected before engineering.
- Bundled HTML starter demonstrates UX/visual behavior and does not define production architecture.
- Pattern compositions are strong defaults with permitted adaptation; exact screenshots/visual sources require separate
  access.
- Frontend engineering follows TARGET_REPO-first implementation evidence and explicit approval gates.
