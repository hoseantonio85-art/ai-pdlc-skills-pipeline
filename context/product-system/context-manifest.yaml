limitations:
- NORM is the default configured product context for this distribution; another product may be selected explicitly
  through the context registry/selector.
- Product knowledge describes the intended/stable product model and does not by itself prove production behavior
  or release state.
- Current product state is documented-partial; frontend/backend repositories and release registry remain task-specific/external
  evidence unless explicitly connected.
- Visual rules are an MVP synthesis from verified product repositories and authored pattern documents.
- Screenshots are not available to GigaCode as canonical runtime context; task-specific screenshots remain evidence
  only.
- HTML prototypes are UX/visual evidence, not production UI Kit implementations.
- External OpenSpec/analytics/UI Kit code and repositories are not packaged; verify exact files, versions and permissions
  through product-evidence.yaml before claiming access.
