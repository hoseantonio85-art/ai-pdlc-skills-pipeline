schema_version: 4
context_id: norm
purpose: Map product content and external, user-authorized evidence; no embedded source repositories or specs
local_context:
  status: ready
  provider: local_repository
  manifest: product-system/context-manifest.yaml
external_registry: ~/.gigacode/product-evidence.yaml
external_sources:
  product_specifications:
    status: not_bundled
    fields:
    - products.norm.specifications.local_root
    - products.norm.specifications.index_url
    rule: read selected approved specs only; verify revision and access
  ui_kit:
    status: not_bundled
    fields:
    - products.norm.ui_kit.package_path
    - products.norm.ui_kit.docs_root
    - products.norm.ui_kit.docs_url
    rule: do not claim availability unless accessible
  frontend:
    status: not_bundled
    fields:
    - products.norm.repositories.frontend_root
  backend:
    status: not_bundled
    fields:
    - products.norm.repositories.backend_root
  visual_references:
    status: not_bundled
    fields:
    - products.norm.design_references.local_root
    - products.norm.design_references.index_url
  release_registry:
    status: not_connected
  product_analytics:
    status: not_connected
historical_review:
  subject: measures
  snapshot_date: '2026-10-23'
  production_verified: false
  primary_document: product-system/02_domain/services/measures.md
  questions: product-system/02_domain/registry/measures_questions.md
rules:
- The existence of a model capability does not imply production release
- Separate requirement, historic implementation evidence, owner decision, and live runtime
- Unavailable evidence = NEEDS_SOURCE; do not invent links, API or current state
