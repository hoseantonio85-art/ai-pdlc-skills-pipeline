schema_version: 1
context_id: norm
roles:
  risk_manager:
    label: Риск-менеджер
    goals:
    - понимать текущую ситуацию с рисками
    - находить приоритетные риски и инциденты
    - понимать причины оценки
    - связывать инциденты, риски, меры и источники
    - определять необходимость реакции
    - контролировать выполнение мер
    - проверять основания выводов системы
    services:
    - risk_analysis
    - incidents
    - measures
    - sources
    - monitoring
    - ai_assistant
    - risk_registry
    - limit_campaign
    - agent_risks
    - product_risks
    permissions_status: unknown
  executive:
    label: Руководитель
    goals:
    - видеть общую картину
    - понимать зоны внимания
    - оценивать динамику и последствия
    - видеть критичные инциденты
    - понимать состояние мер
    - получать суть и объяснение без ручного анализа деталей
    services:
    - risk_analysis
    - incidents
    - measures
    - monitoring
    - ai_assistant
    - risk_registry
    - limit_campaign
    permissions_status: unknown
  methodologist:
    label: Методолог
    goals:
    - проверять корректность логики оценки
    - видеть источники и основания выводов
    - управлять методологическими материалами
    - следить за актуальностью знаний
    - отслеживать изменения регулирования
    - обновлять подходы и методологию
    services:
    - risk_analysis
    - sources
    - monitoring
    - ai_assistant
    - risk_registry
    - agent_risks
    - product_risks
    permissions_status: unknown
  incident_initiator:
    label: Сотрудник / инициатор инцидента
    goals:
    - зафиксировать произошедший инцидент
    - передать необходимые сведения
    - уточнить детали по запросу
    services:
    - incidents
    permissions_status: unknown
  measure_executor:
    label: Исполнитель меры
    goals:
    - понять, что требуется сделать
    - выполнить действие
    - обновить статус
    - уточнить контекст меры через ассистента при наличии сценария
    services:
    - measures
    - ai_assistant
    permissions_status: unknown
  knowledge_owner:
    label: Администратор / владелец базы знаний
    goals:
    - управлять структурой источников
    - следить за статусами обработки
    - поддерживать качество и актуальность данных
    services:
    - sources
    - dictionaries_administration
    permissions_status: unknown
  campaign_curator:
    label: Куратор лимитной кампании
    goals:
    - участвовать в согласовании годовых лимитов
    services:
    - limit_campaign
    permissions_status: defined_partially_in_openspec; verify per-action/role
  campaign_partner:
    label: Партнёр по лимитной кампании
    goals:
    - согласовывать/утверждать лимиты в рамках серверного workflow
    services:
    - limit_campaign
    permissions_status: defined_partially_in_openspec; verify per-action/role
  agent_risk_user:
    label: Пользователь оценки ИИ-агентов
    goals:
    - регистрировать/просматривать агента и взаимодействовать с его оценкой при наличии
      прав
    services:
    - agent_risks
    permissions_status: defined_partially_in_openspec; verify per-action/role
  product_risk_user:
    label: Пользователь оценки продуктов
    goals:
    - управлять продуктом и запускать оценку по разрешённым действиям
    services:
    - product_risks
    permissions_status: defined_partially_in_openspec; verify per-action/role
  contractor_user:
    label: Пользователь сервиса контрагентов
    goals:
    - просматривать контрагентов, договоры и результаты проверок
    services:
    - contractors
    permissions_status: defined_partially_in_openspec; verify per-action/role
  company_admin:
    label: Администратор организации
    goals:
    - настраивать профиль компании, пользователей, тарифные и справочные сведения
      по разрешениям
    services:
    - company_access
    - dictionaries_administration
    - sources
    permissions_status: defined_partially_in_openspec; verify per-action/role
